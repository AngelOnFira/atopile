[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/atopile/atopile"

[workspace.dependencies]
logos = "0.15"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chumsky = "0.9"
ariadne = "0.4"
num-traits = "0.2"
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["yaml"] }
walkdir = "2"

# Internal crates
ato-lexer = { path = "crates/ato-lexer" }
ato-parser = { path = "crates/ato-parser" }
ato-domain = { path = "crates/ato-domain" }
ato-solver = { path = "crates/ato-solver" }
ato-ir = { path = "crates/ato-ir" }
ato-sema = { path = "crates/ato-sema" }
ato-cli = { path = "crates/ato-cli" }
ato-parts = { path = "crates/ato-parts" }
ato-export = { path = "crates/ato-export" }
