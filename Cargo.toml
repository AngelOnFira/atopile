[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/atopile/atopile"

[workspace.dependencies]
logos = "0.15"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal crates
ato-lexer = { path = "crates/ato-lexer" }
