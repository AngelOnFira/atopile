[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/atopile/atopile"

[workspace.dependencies]
logos = "0.15"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chumsky = "0.9"
ariadne = "0.4"
num-traits = "0.2"
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["yaml"] }
walkdir = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
serde_yml = "0.0.12"
semver = { version = "1", features = ["serde"] }
git2 = "0.20"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
rayon = "1.10"
indicatif = "0.17"
console = "0.15"

# Internal crates
ato-lexer = { path = "crates/ato-lexer" }
ato-parser = { path = "crates/ato-parser" }
ato-domain = { path = "crates/ato-domain" }
ato-solver = { path = "crates/ato-solver" }
ato-ir = { path = "crates/ato-ir" }
ato-sema = { path = "crates/ato-sema" }
ato-cli = { path = "crates/ato-cli" }
ato-parts = { path = "crates/ato-parts" }
ato-export = { path = "crates/ato-export" }
