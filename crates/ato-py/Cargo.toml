[package]
name = "ato-py"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Python bindings for Ato Rust crates"

[lib]
name = "ato_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
ato-lexer.workspace = true
ato-domain.workspace = true
ato-solver.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []

# Enable ato-parser if available
parser = ["dep:ato-parser"]

[dependencies.ato-parser]
path = "../ato-parser"
optional = true
